version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # Mount these for development purpose only
      # - ./src:/app/src
      # - ./public:/app/public

  # For development, uncomment the below service and comment out the above service
  # dev:
